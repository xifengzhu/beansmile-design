# Web 平台核心规则卡
# 校验 schema: docs/superpowers/specs/schemas/rule-card.schema.json
# 对应设计规范第 10.1 第 2 层（平台官方规范）与第 11 章（平台适配：Web）。
# 这些是 Web 平台的实现习惯/官方实践，与 wcag-2.2-aa.yaml 的硬性判据互补而非重复。

rules:
  - id: web-native-html-first
    title: 优先使用原生 HTML 元素
    rule: 有语义等价的原生元素时优先使用（button/a/input/nav/dialog 等），仅在原生无法满足时才用 ARIA 补充。
    publisher: W3C
    source_url: https://www.w3.org/TR/using-aria/#rule1
    source_version: Using ARIA (W3C Working Group Note)
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [semantics, aria, components]
    strength: recommended
    evidence_grade: A
    rationale: ARIA 第一准则；原生元素自带键盘、焦点与语义，自定义实现易出缺陷。
    check_method: mixed
    conflicts_with: []

  - id: web-landmark-regions
    title: 使用地标区域组织页面
    rule: 用 header/nav/main/footer 等地标（或等价 role）划分页面主要区域，每页恰有一个 main。
    publisher: W3C
    source_url: https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/
    source_version: WAI-ARIA Authoring Practices Guide
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [semantics, structure, navigation]
    strength: recommended
    evidence_grade: A
    rationale: 地标让屏幕阅读器用户按区域快速跳转，改善大页面导航。
    check_method: mixed

  - id: web-form-label-association
    title: 表单控件与标签编程关联
    rule: 每个输入控件有编程关联的标签（label[for]/aria-labelledby/aria-label），点击标签能聚焦控件。
    publisher: W3C
    source_url: https://www.w3.org/WAI/tutorials/forms/labels/
    source_version: WAI Web Accessibility Tutorials
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [forms, labels, semantics]
    strength: required
    evidence_grade: A
    rationale: 关联标签是满足 WCAG 1.3.1/3.3.2 的基础实现，未关联则辅助技术读不出用途。
    check_method: mixed
    conflicts_with: []

  - id: web-modal-focus-management
    title: 模态对话框焦点管理
    rule: 打开模态时把焦点移入对话框、限制 Tab 在其内循环、Esc 可关闭、关闭后焦点返回触发元素，并设 role=dialog + aria-modal。
    publisher: W3C
    source_url: https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/
    source_version: WAI-ARIA Authoring Practices Guide
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [modal, focus, keyboard]
    strength: recommended
    evidence_grade: A
    rationale: 焦点管理缺失会造成键盘陷阱或焦点游离到背景内容。
    check_method: mixed

  - id: web-viewport-meta-scalable
    title: viewport 允许缩放
    rule: 设置响应式 viewport meta，且不使用 user-scalable=no 或 maximum-scale 限制用户缩放。
    publisher: MDN
    source_url: https://developer.mozilla.org/en-US/docs/Web/HTML/Guides/Viewport_meta_element
    source_version: MDN Web Docs
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [responsive, zoom, viewport]
    strength: required
    evidence_grade: A
    rationale: 禁用缩放会阻断低视力用户放大，违反 WCAG 1.4.4。
    check_method: automated

  - id: web-input-autocomplete
    title: 常见输入声明 autocomplete
    rule: 收集用户个人信息的字段（姓名、邮箱、电话、地址等）使用规范的 autocomplete token。
    publisher: W3C
    source_url: https://www.w3.org/TR/WCAG22/#identify-input-purpose
    source_version: WCAG 2.2
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [forms, autofill]
    strength: recommended
    evidence_grade: A
    rationale: 支撑 WCAG 1.3.5，帮助自动填充与认知障碍用户减少输入负担。
    check_method: mixed

  - id: web-reduced-motion
    title: 尊重减少动效偏好
    rule: 通过 prefers-reduced-motion 为敏感用户降低或移除非必要动画与视差。
    publisher: MDN
    source_url: https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion
    source_version: MDN Web Docs
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [motion, animation]
    strength: recommended
    evidence_grade: B
    rationale: 支撑 WCAG 2.3.3；过度动效会引发前庭障碍用户不适。
    check_method: mixed

  - id: web-page-lang-title
    title: 页面声明语言与描述性标题
    rule: html 元素设 lang 属性；每页有唯一、描述性的 title，反映页面主题或用途。
    publisher: W3C
    source_url: https://www.w3.org/TR/WCAG22/#page-titled
    source_version: WCAG 2.2
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [semantics, structure, i18n]
    strength: required
    evidence_grade: A
    rationale: 支撑 WCAG 2.4.2/3.1.1；缺失会影响朗读发音与多标签页定位。
    check_method: automated

  - id: web-skip-link
    title: 提供跳到主内容链接
    rule: 页面首个可聚焦元素为"跳到主内容"链接（可视觉隐藏、聚焦时显示），激活后焦点落到 main。
    publisher: W3C
    source_url: https://www.w3.org/WAI/WCAG22/Techniques/general/G1
    source_version: WCAG 2.2 Techniques
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [keyboard, navigation, structure]
    strength: recommended
    evidence_grade: A
    rationale: 键盘用户免于 Tab 穿越整个页头，支撑 WCAG 2.4.1。
    check_method: mixed

  - id: web-heading-structure
    title: 标题层级结构化且不跳级
    rule: 用 h1–h6 反映内容大纲：每页唯一 h1，层级逐级递进不跳级，视觉大小与语义层级分离控制。
    publisher: W3C
    source_url: https://www.w3.org/WAI/tutorials/page-structure/headings/
    source_version: WAI Web Accessibility Tutorials
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [semantics, structure, headings]
    strength: recommended
    evidence_grade: A
    rationale: 屏幕阅读器用户按标题大纲跳转，跳级与错序破坏页面导航。
    check_method: automated

  - id: web-status-messages
    title: 动态状态消息编程可知
    rule: 不移动焦点的动态反馈（保存成功、校验错误汇总、加载完成）用 role=status/alert 或 aria-live 通知辅助技术。
    publisher: W3C
    source_url: https://www.w3.org/TR/WCAG22/#status-messages
    source_version: WCAG 2.2
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [feedback, aria, states]
    strength: required
    evidence_grade: A
    rationale: WCAG 4.1.3；视觉出现的状态变化若不播报，屏幕阅读器用户完全无感。
    check_method: mixed

  - id: web-data-table-semantics
    title: 数据表使用表格语义
    rule: 数据表用 table/caption/th+scope 构建；布局禁用表格实现；复杂表头用 headers/id 关联。
    publisher: W3C
    source_url: https://www.w3.org/WAI/tutorials/tables/
    source_version: WAI Web Accessibility Tutorials
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [semantics, tables, structure]
    strength: recommended
    evidence_grade: A
    rationale: 表头关联缺失时，辅助技术无法播报单元格含义。
    check_method: mixed

  - id: web-image-dimensions-cls
    title: 媒体声明尺寸防布局跳动
    rule: 图片/视频/嵌入内容声明 width/height 或 aspect-ratio，动态区域预留占位尺寸，避免加载导致的布局偏移。
    publisher: MDN
    source_url: https://developer.mozilla.org/en-US/docs/Glossary/CLS
    source_version: MDN Web Docs
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [layout, performance, stability]
    strength: recommended
    evidence_grade: B
    rationale: 布局跳动导致误点与阅读丢失，对应规范 7.5"稳定尺寸与约束"。
    check_method: automated

  - id: web-font-display-swap
    title: webfont 加载期间文本可见
    rule: "自定义字体声明 font-display: swap（或等效策略）并提供系统字体兜底，字体加载失败或缓慢时文本始终可读。"
    publisher: MDN
    source_url: https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display
    source_version: MDN Web Docs
    last_verified: "2026-07-24"
    platforms: [web, mobile_web]
    scope: [typography, performance, fonts]
    strength: recommended
    evidence_grade: B
    rationale: 不可见文本闪烁（FOIT）在弱网下等于内容缺失。
    check_method: automated
