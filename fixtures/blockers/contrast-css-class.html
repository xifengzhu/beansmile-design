<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><title>CSS class 低对比度</title>
  <style>
    .muted { color: #9a9a9a; background-color: #ffffff; }
  </style>
</head>
<body>
  <main>
    <h1>公告</h1>
    <!-- 植入：低对比度来自 CSS class 而非 inline style -->
    <p class="muted">这段说明用 class 定义颜色，对比度不足。</p>
  </main>
</body>
</html>
