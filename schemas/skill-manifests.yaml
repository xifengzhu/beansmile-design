# 五个流程 Skill 的读写白名单清单
# 校验 schema: skill-manifest.schema.json
# 用途: Design Director 在合并每个 Skill 的 context 补丁前，做字段级 diff 门禁；
#       只有落在 writes 白名单内的改动才被接受 (设计规范第 5.2 章)。
# 读写路径的合法取值见 context.schema.json 的顶层字段。

manifests:
  - skill: requirements_research
    reads: [project, brand, constraints]
    writes: [users, goals, constraints, assumptions, artifacts.brief, stage]
    produces:
      - brief.md

  - skill: ux_architecture
    reads: [project, users, goals, constraints, decisions]
    writes: [artifacts.flows, stage]
    produces:
      - flows.md

  - skill: visual_system
    reads: [project, brand, goals, users, constraints, artifacts.design_document]
    writes: [artifacts.tokens, decisions, stage]
    produces:
      - design-tokens.json

  - skill: html_prototype
    reads: [project, users, goals, brand, constraints, artifacts.design_document, artifacts.flows, artifacts.tokens]
    writes: [artifacts.prototype, assumptions, stage]
    produces:
      - prototype/index.html
      - prototype/scenarios.json

  - skill: decision_record
    reads: [project, goals, users, brand, constraints, decisions, exceptions, assumptions]
    writes: [decisions, exceptions, stage]
    produces:
      - decisions.md

  - skill: design_specification
    operations:
      prepare:
        reads: [project, users, goals, brand, constraints, assumptions, decisions, exceptions, artifacts.brief, artifacts.flows]
        writes: [artifacts.design_document]
      finalize:
        reads: [project, users, goals, brand, constraints, assumptions, decisions, exceptions, artifacts.brief, artifacts.flows, artifacts.tokens, artifacts.prototype, artifacts.design_document]
        writes: [artifacts.design_document]
    produces: [Design.md]
    required_modes: [professional]

  - skill: design_presentation
    reads: [project, users, goals, brand, constraints, assumptions, decisions, exceptions, artifacts.flows, artifacts.tokens, artifacts.prototype, artifacts.design_document]
    writes: [artifacts.presentation]
    produces: [presentation/design-system.pptx, audit/presentation/manifest.json, audit/presentation/qa.json]
    required_modes: [professional]
